# Dependabot configuration (chosen over Renovate for native GitHub support).
# Keeps the three ecosystems in this repo up to date with weekly update PRs.
# Minor/patch bumps are grouped to reduce PR noise, and the Angular/Nx
# packages are grouped together because they are version-locked in this repo.
version: 2
updates:
  # npm (root package.json / package-lock.json): Angular 17 + Ionic/Capacitor + Nx
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      angular-nx:
        patterns:
          - "@angular*"
          - "@angular-devkit/*"
          - "@angular-eslint/*"
          - "@schematics/angular"
          - "@nx/*"
          - "@nx-dotnet/*"
          - "@nxext/*"
          - "@nx-plus/*"
          - "nx"
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # NuGet (.NET solution under core/csharp, central package management via
  # Directory.Packages.props). Dependabot discovers the .sln/.csproj and
  # Directory.Packages.props under this directory.
  - package-ecosystem: "nuget"
    directory: "/core/csharp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the workflows in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
