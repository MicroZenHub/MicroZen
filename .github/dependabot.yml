# Dependabot configuration (chosen over Renovate for native GitHub support).
# Keeps the three ecosystems in this repo up to date with weekly update PRs.
# Minor/patch bumps are grouped to reduce PR noise, and the Nx packages are
# grouped together because they are version-locked in this repo.
version: 2
updates:
  # npm (root package.json / package-lock.json): .NET-only toolchain
  # (nx + @nx-dotnet/core + prettier).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      nx:
        patterns:
          - '@nx/*'
          - '@nx-dotnet/*'
          - 'nx'
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # NuGet (.NET solution under core/csharp, central package management via
  # Directory.Packages.props). Dependabot discovers the .sln/.csproj and
  # Directory.Packages.props under this directory.
  - package-ecosystem: 'nuget'
    directory: '/core/csharp'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions used by the workflows in .github/workflows.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
