name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Connect your workspace on nx.app and uncomment this to enable task distribution.
      # The "--stop-agents-after" is optional, but allows idle agents to shut down once the "build" targets have been requested
      # - run: npx nx-cloud start-ci-run --distribute-on="5 linux-medium-js" --stop-agents-after="build"

      # Cache node_modules
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install
      - uses: nrwl/nx-set-shas@v4

      # Nx Cloud uses a read-only access token, so the format step runs plain
      # `nx format:check` (it cannot record a run). The token stays available on
      # the `nx affected` step below so remote cache reads still work.
      - run: npx nx format:check
      - run: npx nx affected -t lint test build
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore core/csharp/MicroZen.Core.sln
      - run: dotnet build core/csharp/MicroZen.Core.sln --configuration Release --no-restore
      # MicroZen.Api.Test uses the EF Core InMemory provider and sets its own
      # EncryptionKey, so the .NET tests are self-contained and need no database.
      - run: dotnet test core/csharp/MicroZen.Core.sln --configuration Release --no-build --verbosity normal
