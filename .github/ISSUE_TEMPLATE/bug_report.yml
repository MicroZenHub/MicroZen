name: Bug report
description: Report a problem so it can be reproduced and fixed.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >
        Thanks for taking the time to file a bug. Please fill in the sections
        below so the issue can be reproduced and triaged. Run the gate
        (`npx nx format:check`, `npx nx affected -t lint test build`,
        `dotnet test core/csharp/MicroZen.Core.sln`) if the bug relates to a
        build or test failure.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Run '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include error output or stack traces.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The versions and OS where you observed the bug.
      value: |
        - OS:
        - .NET SDK version (`dotnet --version`, target is net10.0):
        - Node.js version (`node --version`):
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps explain the problem (logs, screenshots, links).
    validations:
      required: false
