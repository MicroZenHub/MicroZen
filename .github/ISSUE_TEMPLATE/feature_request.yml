name: Feature request
description: Suggest an idea or enhancement for MicroZen.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: >
        Thanks for suggesting an improvement. Please describe the problem you
        are trying to solve and the change you have in mind.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What is the use case?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the change you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why you did not choose them.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps explain the request (links, mockups, references).
    validations:
      required: false
